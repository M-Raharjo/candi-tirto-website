about_id: >-
  Menyajikan cita rasa autentik yang memanjakan lidah melalui perpaduan unsur
  tradisional.

  Setiap hidangan kami diracik menggunakan bahan-bahan terbaik demi menjamin
  kualitas yang tiada duanya.

  Nikmati suasana hangat dan nyaman yang membuat Anda merasa seperti di rumah
  sendiri.

  Kami percaya bahwa setiap suapan adalah pengalaman yang tak terlupakan.

  Rasakan kelezatan sejati dan puaskan selera Anda dengan setiap hidangan kami.
